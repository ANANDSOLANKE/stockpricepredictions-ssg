name: Build & Deploy SSG

on:
  push:
    paths:
      - 'Data/**'
      - 'scripts/**'
      - 'static/**'
      - 'config.json'
      - '.github/workflows/ssg.yml'
  workflow_dispatch:

# let the workflow push to gh-pages without changing repo settings
permissions:
  contents: write

# avoid overlapping runs
concurrency:
  group: ssg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Debug repo tree
        run: |
          echo "== TOP LEVEL ==" && ls -la
          echo "== Data tree ==" && (find Data -maxdepth 3 -print || true)

      - name: Build site
        run: python scripts/build.py

      - name: Upload dist as artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # creates a clean branch history; OK for static sites
          force_orphan: true
