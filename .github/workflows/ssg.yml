name: Build & Deploy SSG

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stockpricepredictions-ssg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure logos exist in dist (fast)
        run: |
          if [ -d logos ]; then
            mkdir -p dist
            if [ ! -d dist/logos ]; then
              cp -r logos dist/
            fi
          fi

      - name: Build site (fast + last7)
  env:
    SKIP_LOGOS: "1"
  run: |
    python scripts/build.py
    python scripts/build_last7.py


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
