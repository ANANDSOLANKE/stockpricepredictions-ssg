name: Build & Deploy SSG

on:
  workflow_run:
    workflows: ["Auto download market data"]   # 👈 must match the name line in data-auto.yml
    types: [completed]

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Build site
        run: python scripts/build.py

      - name: Deploy to GitHub Pages
        run: |
          # Replace this with your deploy command (e.g. move dist → gh-pages branch)
