name: Build & Deploy SSG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Data/**"
      - "scripts/**"
      - "static/**"
      - "config.json"
      - "logos/**"
      - ".github/workflows/ssg.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas; fi

      - name: Show repo tree (debug)
        run: |
          echo "Top-level files:"; ls -la
          echo "Data/:"; ls -la Data || true
          echo "logos/:"; ls -la logos || true

      - name: Build site
        run: |
          python scripts/build.py
          test -d dist && echo "Built dist/" && find dist -type f | wc -l

      # Upload the built site as a Pages artifact (zips automatically)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
