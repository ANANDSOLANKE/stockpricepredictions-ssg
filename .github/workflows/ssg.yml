name: Build & Deploy SSG

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "templates/**"
      - "static/**"
      - "logos/**"
      - ".github/workflows/ssg.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas jinja2 python-slugify || true
          # if you later add requirements.txt, this also works (won't fail if missing):
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      # Ensure logos are present quickly even before build.py runs
      - name: Ensure logos exist in dist (fast)
        run: |
          if [ -d logos ]; then
            mkdir -p dist
            if [ ! -d dist/logos ]; then
              cp -r logos dist/
              echo "Copied logos → dist/logos"
            else
              echo "Logos already present"
            fi
          fi

      - name: Verify site logo present
        run: |
          test -f dist/logos/site/logo.png || (echo "❌ dist/logos/site/logo.png missing!" && ls -R dist/logos || true && exit 1)
          echo "✅ Verified logo: dist/logos/site/logo.png"

      # 🏗️ Build all region/country/exchange/stock pages
      - name: Build site (fast)
        run: |
          python -u scripts/build.py
          echo "—— Contents of dist/ (top 50) ——"
          ls -lah dist | head -50

      # Make sure the landing page made it into dist/
      - name: Verify landing page
        run: |
          test -f dist/index.html || (echo "❌ dist/index.html missing! Check scripts/build.py copy step." && exit 1)
          echo "✅ Landing page ready: dist/index.html"

      # 🔎 Global search (hero input) → builds /static/search_index.json + /static/search.js
      - name: Run search_setup.py
        run: python -u scripts/search_setup.py

      # (Optional) Last-7 performance widget (safe)
      - name: Inject last-7 performance
        run: python -u scripts/build_last7.py

      # (Optional) Curated logo mappings (safe)
      - name: Inject logos from mapping
        run: python -u scripts/inject_logos.py

      # 🎨 Rebuild ONLY prediction pages with V2 theme (safe for homepage)
      - name: Apply full v2 rebuild (webpage.html look)
        run: python -u scripts/theme_rebuild_v2.py

      - name: Cleanup old sitemap folder
        run: |
          rm -rf dist/sitemaps || true
          echo "🧹 Old /sitemaps folder removed"

      # Split sitemap into chunks + index (root: /sitemap.xml + /sitemap1..4.xml)
      - name: Split sitemap into chunks + index
        run: python -u scripts/sitemap_split.py

      # 📦 Upload artifact to GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 🚀 Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 🔍 SEO Fast-Track — Ping all major search engines
      - name: Notify Search Engines (Google, Bing, Yandex, DuckDuckGo)
        if: success()
        run: |
          SITEMAP_URL="https://stockpricepredictions.com/sitemap.xml"
          echo "🔍 Pinging search engines with $SITEMAP_URL ..."
          curl -fsS "https://www.google.com/ping?sitemap=${SITEMAP_URL}" -o /dev/null || true
          curl -fsS "https://www.bing.com/ping?sitemap=${SITEMAP_URL}" -o /dev/null || true
          curl -fsS "https://yandex.com/ping?sitemap=${SITEMAP_URL}" -o /dev/null || true
          curl -fsS "https://duckduckgo.com/ping?sitemap=${SITEMAP_URL}" -o /dev/null || true
          echo "✅ Sitemap ping sent."
