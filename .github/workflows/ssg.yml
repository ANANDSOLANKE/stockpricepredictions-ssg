name: Build & Deploy SSG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repo tree (top 3 levels)
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type d -print | sort

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas
          fi

      - name: Sanity check data folder
        run: |
          test -d Data || (echo "ERROR: Data/ folder not found at repo root" && exit 1)
          ls -la Data || true
          find Data -maxdepth 2 -type d -print | sort || true

      - name: Build site
        run: |
          set -e
          python scripts/build.py
          echo "---- built files ----"
          find dist -maxdepth 3 -type f | sort | sed 's/^/dist: /'

      - name: Verify key outputs
        run: |
          test -f dist/index.html || (echo "ERROR: dist/index.html missing" && exit 1)
          test -f dist/data/index.json || (echo "ERROR: dist/data/index.json missing" && exit 1)

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: stockpricepredictions.com
          force_orphan: true
