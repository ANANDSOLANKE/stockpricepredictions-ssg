name: Update & Build SSG
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # …your steps that modify/commit build.py…
      - name: Commit updated build.py
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add build.py
          git commit -m "CI: update build.py" || echo "No changes"
          git push

  build:
    needs: update          # ← ensures update finishes first (and succeeds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Build site
        run: python scripts/build.py
