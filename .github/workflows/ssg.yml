name: Build & Deploy SSG

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "templates/**"
      - "static/**"
      - "logos/**"
      - ".github/workflows/ssg.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600   # ⬅️ give first full injection room to finish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas jinja2 python-slugify

      - name: Ensure logos exist in dist (fast)
        run: |
          if [ -d logos ]; then
            mkdir -p dist
            if [ ! -d dist/logos ]; then
              cp -r logos dist/
              echo "Copied logos → dist/logos"
            else
              echo "Logos already present"
            fi
          fi

      - name: Build site (fast)
        run: python -u scripts/build.py

      - name: Inject last-7 performance
        run: python -u scripts/build_last7.py
        
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
