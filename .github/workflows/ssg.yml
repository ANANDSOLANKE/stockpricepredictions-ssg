name: Build & Deploy SSG

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "templates/**"
      - "static/**"
      - "logos/**"
      - ".github/workflows/ssg.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas jinja2 python-slugify

      # ---- your build steps (unchanged) ----
      - name: Build site (fast)
        run: python -u scripts/build.py

      - name: Run search_setup.py
        run: python -u scripts/search_setup.py

      - name: Inject last-7 performance
        run: python -u scripts/build_last7.py

      - name: Inject logos from mapping
        run: python -u scripts/inject_logos.py

      - name: Apply full v2 rebuild (webpage.html look)
        run: python -u scripts/theme_rebuild_v2.py
      # --------------------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ---------- Option B: Stage only production files into _site/ ----------
      - name: Prepare Pages bundle (_site)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          shopt -s nullglob dotglob

          # Files to copy if present at repo root
          to_copy=("index.html" "404.html" "robots.txt" "sitemap.xml" "CNAME")
          for f in "${to_copy[@]}"; do
            [[ -f "$f" ]] && cp -f "$f" _site/
          done

          # Google Search Console URL-prefix verification files (optional backup)
          for f in google*.html; do
            [[ -f "$f" ]] && cp -f "$f" _site/
          done

          # Common content/asset directories (copy only if they exist)
          dirs=(
            "Asia-Pacific" "Europe" "Middle-East-Africa" "North-America" "South-America"
            "India" "USA" "UK"
            "static" "assets" "css" "js" "logos" "images" "search" "flags"
          )
          for d in "${dirs[@]}"; do
            [[ -d "$d" ]] && cp -R "$d" _site/
          done

          # Catch-all: include any other top-level HTML files
          for f in *.html; do
            [[ -f "$f" ]] && cp -f "$f" _site/
          done

          # Safety: ensure robots.txt exists
          if [[ ! -f _site/robots.txt ]]; then
            printf '%s\n' \
              'User-agent: *' \
              'Allow: /' \
              'Sitemap: https://stockpricepredictions.com/sitemap.xml' > _site/robots.txt
          fi

          # Safety: include sitemap if only at repo root
          if [[ ! -f _site/sitemap.xml && -f sitemap.xml ]]; then
            cp sitemap.xml _site/
          fi

          echo "✅ Staged site. Sample tree:"
          find _site -maxdepth 2 -type d -print
      # -----------------------------------------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
