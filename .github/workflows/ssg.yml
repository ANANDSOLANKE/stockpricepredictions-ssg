name: Build & Deploy SSG

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "templates/**"
      - "static/**"
      - "logos/**"
      - ".github/workflows/ssg.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas jinja2 python-slugify || true
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      # ---- Pre-warm logos so early steps don't fail
      - name: Ensure logos exist in dist (fast)
        run: |
          if [ -d logos ]; then
            mkdir -p dist
            cp -rn logos dist/ || true
          fi

      - name: Verify site logo present (early)
        run: |
          test -f dist/logos/site/logo.png || (echo "❌ dist/logos/site/logo.png missing (early)!" && ls -R dist/logos || true && exit 1)
          echo "✅ Verified logo (early): dist/logos/site/logo.png"

      # 🏗️ Build everything
      - name: Build site (fast)
        run: python -u scripts/build.py

      - name: Verify landing page
        run: |
          test -f dist/index.html || (echo "❌ dist/index.html missing! Check scripts/build.py copy step." && exit 1)
          echo "✅ Landing page ready: dist/index.html"

      - name: Run search_setup.py
        run: python -u scripts/search_setup.py

      - name: Inject last-7 performance
        run: python -u scripts/build_last7.py

      - name: Inject logos from mapping
        run: python -u scripts/inject_logos.py

      - name: Apply full v2 rebuild (webpage.html look)
        run: python -u scripts/theme_rebuild_v2.py

      - name: Cleanup old sitemap folder
        run: |
          rm -rf dist/sitemaps || true
          echo "🧹 Old /sitemaps removed"

      - name: Split sitemap into chunks + index
        run: python -u scripts/sitemap_split.py

      # ---- FINAL PASS: ensure static assets survived later scripts
      - name: Re-sync logos into dist (final)
        run: |
          if [ -d logos ]; then
            mkdir -p dist/logos
            rsync -a --delete logos/ dist/logos/
          fi
          # prevent any Jekyll processing just in case
          touch dist/.nojekyll

      - name: Verify site logo present (final)
        run: |
          test -f dist/logos/site/logo.png || (echo "❌ dist/logos/site/logo.png missing (final)!" && find dist -maxdepth 3 -type d -print && exit 1)
          echo "✅ Verified logo (final): dist/logos/site/logo.png"
          echo "—— dist tree (top) ——"
          find dist -maxdepth 2 -type d -print

      # 📦 Upload artifact to GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
