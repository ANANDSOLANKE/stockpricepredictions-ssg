name: Build logos (mapping)

on:
  workflow_dispatch: {}   # run manually

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ticker-named logos from mapping
        run: |
          python -u scripts/build_logos.py

      - name: Commit & push dist logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/logos || true
          git commit -m "logos: rebuild from mapping $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No logo changes"
          git push
