name: Build logos (mapping)

on:
  workflow_dispatch: {}
  push:
    paths:
      - "logos/**"
      - "scripts/build_logos.py"
      - "logos/logos.csv"
      - "logos/_map/logos.csv"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  logos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (none needed, but keep pip)
        run: python -m pip install --upgrade pip

      - name: Build ticker-named logos from mapping
        run: |
          python scripts/build_logos.py

      # OPTIONAL: if you also want dist/ updated live on the website now:
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
