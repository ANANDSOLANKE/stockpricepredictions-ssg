name: Auto download + build + deploy SSG

on:
  schedule:
    - cron: "0 * * * *"     # every hour (UTC)
  workflow_dispatch:        # allow manual run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas jinja2 python-slugify requests pytz python-dateutil beautifulsoup4 lxml

      # 1) Auto download latest data
      - name: Download latest market data (headless)
        run: |
          echo "[START] $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python downloader/run_headless.py --mode hourly --data-folder Data --window-mins 180
          echo "[END] $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      # 2) Build the site (fast; reuse logos)
      - name: Ensure logos exist in dist (fast)
        run: |
          mkdir -p dist
          if [ -d logos ] && [ ! -d dist/logos ]; then cp -r logos dist/; fi

      - name: Build site (fast; skip logo rescan)
        env:
          SKIP_LOGOS: "1"
        run: python -u scripts/build.py

      # 3) Inject the last-7 table into every prediction page
      - name: Inject last-7 performance
        run: python -u scripts/build_last7.py

      # (Optional) Commit data + dist for audit/history
      - name: Commit and push updated data + dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Data dist || true
          git commit -m "Auto: data + site $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push

      # 4) Publish to GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
