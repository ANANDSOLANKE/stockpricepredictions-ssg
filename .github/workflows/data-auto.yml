name: Auto download market data and build & deploy SSG

on:
  schedule:
    - cron: "0 * * * *"     # every hour (UTC)
  workflow_dispatch:        # allow manual trigger too

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas jinja2 python-slugify

      # --- Auto download latest data ---
      - name: Download latest market data (headless)
        run: |
          echo "[START] $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python downloader/run_headless.py --mode hourly --data-folder Data --window-mins 120
          echo "[END] $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      # --- Ensure logos copied once (fast if exists) ---
      - name: Ensure logos exist in dist (fast)
        run: |
          if [ -d logos ]; then
            mkdir -p dist
            if [ ! -d dist/logos ]; then
              cp -r logos dist/
              echo "Copied logos → dist/logos (first time)"
            else
              echo "Logos already present, skipping copy"
            fi
          else
            echo "No /logos folder found, skipping"
          fi

      # --- Build site quickly (skip logo rescan) ---
      - name: Build site (fast; skip logo rescan)
        env:
          SKIP_LOGOS: "1"
        run: |
          python scripts/build.py

      # --- Commit & push updates ---
      - name: Commit and push updated data + dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Data dist || true
          git commit -m "Auto-update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push

      # --- Deploy to GitHub Pages ---
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
