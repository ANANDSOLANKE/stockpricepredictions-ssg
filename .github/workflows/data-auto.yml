name: Auto download market data

on:
  schedule:
    - cron: "5 * * * *"   # every hour at :05 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssg-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Download/refresh data
        run: |
          python downloader/run_headless.py --mode hourly --data-folder data --window-mins 120

      # If you also pre-build any data files for the site, do it here:
      - name: Build site data (optional)
        run: |
          python scripts/build.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Auto-update data and artifacts" || echo "No changes"
          git push
