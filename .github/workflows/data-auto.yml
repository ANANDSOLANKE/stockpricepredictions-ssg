name: Auto download market data

on:
  schedule:
    - cron: "5 * * * *"   # every hour at :05 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45    # hard stop if something hangs

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (xvfb for safety)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run downloader headless (no GUI loop)
        run: |
          set -euo pipefail
          mkdir -p logs
          RUN_ID="run-$(date -u +'%Y%m%d-%H%M%S-UTC')"
          LOG_FILE="logs/${RUN_ID}.log"
          echo "[START] ${RUN_ID}" | tee -a "$LOG_FILE"

          # Try non-GUI shim first (imports downloader.app and calls a download function)
          python downloader/headless_entry.py --mode hourly 2>&1 | tee -a "$LOG_FILE" || {
            echo "[WARN] headless_entry failed; falling back to GUI under xvfb" | tee -a "$LOG_FILE"
            # Fallback: run original GUI script under xvfb for up to 20 minutes
            timeout 20m xvfb-run -a python downloader/app.py 2>&1 | tee -a "$LOG_FILE"
          }

          echo "[END]   $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a "$LOG_FILE"

      - name: Upload logs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: auto-update-logs
          path: logs/*.log
          if-no-files-found: warn

      - name: Build site
        run: python scripts/build.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
