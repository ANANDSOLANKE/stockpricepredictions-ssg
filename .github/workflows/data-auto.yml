name: Auto download market data

on:
  schedule:
    - cron: "5 * * * *"   # every hour at :05 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Download data (headless CLI)
        run: |
          python downloader/run_headless.py --mode hourly --data-folder data --window-mins 120

      - name: Build site data
        run: python scripts/build.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto-update data" || echo "No changes"
          git push
