name: Build & Deploy SSG

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "scripts/**"
      - "templates/**"
      - "static/**"
      - "logos/**"
      - ".github/workflows/ssg.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas jinja2 python-slugify
          fi

      # ✅ Always sync logos (so logo updates are picked up every run)
      - name: Sync logos into dist (always)
        run: |
          mkdir -p dist/logos
          if [ -d logos ]; then
            rsync -a --delete logos/ dist/logos/
            echo "Logos synced → dist/logos/"
          else
            echo "No local logos/ folder found."
          fi

      - name: Verify site logo present
        run: |
          test -f dist/logos/site/logo.png || (echo "❌ dist/logos/site/logo.png missing!" && exit 1)
          echo "✅ Verified logo: dist/logos/site/logo.png"

      # 🏗️ Build all region/country/exchange/stock pages
      - name: Build site
        run: python -u scripts/build.py

      # 🔎 Global search (hero input) → builds /static/search_index.json + /static/search.js
      - name: Run search_setup.py
        run: python -u scripts/search_setup.py

      # (Optional) Last-7 performance widget
      - name: Inject last-7 performance (optional)
        run: python -u scripts/build_last7.py
        continue-on-error: true

      # (Optional) Curated logo mappings
      - name: Inject logos from mapping (optional)
        run: python -u scripts/inject_logos.py
        continue-on-error: true

      # (Optional) V2 theme touchups for inner pages
      - name: Apply full v2 rebuild (optional)
        run: python -u scripts/theme_rebuild_v2.py
        continue-on-error: true

      # 🧹 Clean old sitemap folder (if present)
      - name: Cleanup old sitemap folder
        run: |
          rm -rf dist/sitemaps || true
          echo "🧹 Old /sitemaps folder removed"

      # 🗺️ Split sitemap (keep if you’re using it; otherwise remove this step)
      - name: Split sitemap into chunks + index
        run: python -u scripts/sitemap_split.py
        continue-on-error: true

      # 🔁 Re-sync logos after build (belt & suspenders)
      - name: Re-sync logos after build
        run: |
          if [ -d logos ]; then
            rsync -a --delete logos/ dist/logos/
          fi

      # 📦 Upload artifact to GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 🚀 Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 🔍 SEO Fast-Track — Ping major search engines
      - name: Notify Search Engines (Google, Bing, Yandex, DuckDuckGo)
        if: success()
        run: |
          SITEMAP_URL="https://stockpricepredictions.com/sitemap.xml"
          echo "🔍 Pinging search engines with $SITEMAP_URL ..."
          curl -fsS "https://www.google.com/ping?sitemap=${SITEMAP_URL}" -o /dev/null || true
          curl -fsS "https://www.bing.com/ping?sitemap=${SITEMAP_URL}" -o /dev/null || true
          curl -fsS "https://yandex.com/ping?sitemap=${SITEMAP_URL}" -o /dev/null || true
          curl -fsS "https://duckduckgo.com/ping?sitemap=${SITEMAP_URL}" -o /dev/null || true
          echo "✅ Sitemap ping sent."
