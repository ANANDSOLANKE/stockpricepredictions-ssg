name: Auto download market data
on:
  schedule:
    - cron: "5 * * * *"    # every hour at :05 UTC
  workflow_dispatch: {}     # manual run button
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Download data (calls your downloader)
        run: |
          python scripts/download_all.py --mode hourly
      - name: Build site
        run: |
          python scripts/build.py
      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
