name: Auto download market data and build & deploy SSG

on:
  workflow_dispatch:        # manual trigger only (re-enable cron later if you want)
  # schedule:
  #   - cron: "0 * * * *"   # uncomment when you're happy again

permissions:
  contents: write
  pages: write
  id-token: write

# 1) Ensure only one run at a time; cancel older stuck ones
concurrency:
  group: stockpricepredictions-ssg-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # run will auto-stop if something goes wrong

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start marker
        run: echo "Started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Download latest market data (headless)
        run: |
          echo "[START] $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python downloader/run_headless.py --mode hourly --data-folder Data --window-mins 120
          echo "[END] $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Ensure logos exist in dist (fast)
        run: |
          if [ -d logos ]; then
            mkdir -p dist
            if [ ! -d dist/logos ]; then
              cp -r logos dist/
              echo "Copied logos → dist/logos (first time)"
            else
              echo "Logos already present, skipping copy"
            fi
          else
            echo "No /logos folder found, skipping"
          fi

      - name: Build site (fast; skip logo rescan)
        env:
          SKIP_LOGOS: "1"
        run: python scripts/build.py

      - name: Commit and push updated data + dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Data dist || true
          git commit -m "Auto-update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push || echo "No push (possibly no changes)"

      # 2) Use official Pages steps to avoid deploy waits
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
