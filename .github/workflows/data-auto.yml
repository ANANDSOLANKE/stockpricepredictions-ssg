name: Auto download market data and build & deploy SSG

on:
  workflow_dispatch:
  schedule:
    # --- Regional close-time passes (UTC) ---
    # APAC ex-India (Japan/Korea/HK/SG/China)
    - cron: "45 6 * * 1-5"
    # India (NSE/BSE)
    - cron: "15 10 * * 1-5"
    # Gulf / Middle East (Sun–Thu)
    - cron: "15 11 * * 0-4"
    # Europe & UK
    - cron: "15 16 * * 1-5"
    # US & Canada
    - cron: "15 21 * * 1-5"

permissions:
  contents: write          # push Data/ and allow Pages artifact
  pages: write             # deploy to GitHub Pages
  id-token: write          # OIDC for Pages

concurrency:
  group: pages-and-data
  cancel-in-progress: true

jobs:
  build:
    name: Download → Build → Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # If you have requirements.txt, prefer that; otherwise install minimal set
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas jinja2 python-slugify
          fi

      # ---------- DATA DOWNLOAD ----------
      # Adjust the script path/args to your actual downloader.
      - name: Download latest market data
        run: |
          set -e
          if [ -f downloader/run_headless.py ]; then
            python -u downloader/run_headless.py
          elif [ -f scripts/downloader.py ]; then
            python -u scripts/downloader.py
          else
            echo "No downloader script found. Skipping download."
          fi

      - name: Detect Data changes
        id: datadiff
        run: |
          git add -A Data || true
          if git diff --cached --quiet -- Data; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # ---------- PREP LOGOS/FLAGS ----------
      - name: Ensure logos and flags exist in dist
        run: |
          mkdir -p dist
          if [ -d logos ]; then
            rsync -a --delete logos/ dist/logos/
            echo "Logos synced → dist/logos/"
          fi
          if [ -d logos/countryflags ]; then
            mkdir -p dist/logos/countryflags
            rsync -a --delete logos/countryflags/ dist/logos/countryflags/
            echo "Flags synced → dist/logos/countryflags/"
          fi

      - name: Verify site logo present
        run: |
          test -f dist/logos/site/logo.png || (echo "❌ dist/logos/site/logo.png missing! Add /logos/site/logo.png to repo." && exit 1)
          echo "✅ Verified logo: dist/logos/site/logo.png"

      # ---------- BUILD SSG (Gemini layout) ----------
      - name: Build site (full)
        run: |
          set -e
          python -u scripts/build.py
          python -u scripts/search_setup.py
          # optional utilities (run only if they exist)
          [ -f scripts/build_last7.py ]    && python -u scripts/build_last7.py    || true
          [ -f scripts/inject_logos.py ]   && python -u scripts/inject_logos.py   || true
          [ -f scripts/theme_rebuild_v2.py ] && python -u scripts/theme_rebuild_v2.py || true
          # sitemap (prefer your splitter if present)
          if [ -f scripts/sitemap_split.py ]; then
            python -u scripts/sitemap_split.py
          else
            echo "Keeping single sitemap generated by build.py"
          fi

      # Re-sync logos after build (belt & suspenders)
      - name: Re-sync logos to dist
        run: |
          if [ -d logos ]; then
            rsync -a --delete logos/ dist/logos/
          fi

      # ---------- COMMIT DATA (only when changed) ----------
      - name: Commit & push updated Data
        if: steps.datadiff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Data
          git commit -m "chore(data): auto-update market Data on schedule"
          git push

      # ---------- DEPLOY GITHUB PAGES ----------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600

      # ---------- SITEMAP PING ----------
      - name: Notify Search Engines (Google, Bing, Yandex, DuckDuckGo)
        if: success()
        run: |
          SITEMAP_URL="https://stockpricepredictions.com/sitemap.xml"
          echo "🔍 Pinging search engines with $SITEMAP_URL ..."
          # Google ping endpoint is legacy; harmless to keep
          curl -fsS "https://www.google.com/ping?sitemap=${SITEMAP_URL}" -o /dev/null || true
          curl -fsS "https://www.bing.com/ping?sitemap=${SITEMAP_URL}" -o /dev/null || true
          curl -fsS "https://yandex.com/ping?sitemap=${SITEMAP_URL}" -o /dev/null || true
          curl -fsS "https://duckduckgo.com/ping?sitemap=${SITEMAP_URL}" -o /dev/null || true
          echo "✅ Sitemap ping sent."
