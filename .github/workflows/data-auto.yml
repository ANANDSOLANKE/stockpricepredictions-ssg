name: Auto download market data and build & deploy SSG

on:
  schedule:
    - cron: "0 * * * *"        # every hour (UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas jinja2 python-slugify requests pytz python-dateutil beautifulsoup4 lxml
          fi

      - name: Download latest market data (headless)
        run: |
          echo "[START] $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python downloader/run_headless.py --mode hourly --data-folder Data --window-mins 120 || true
          echo "[END] $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Ensure logos exist in dist (fast)
        run: |
          if [ -d logos ]; then
            mkdir -p dist
            if [ ! -d dist/logos ]; then
              cp -r logos dist/
              echo "Copied logos → dist/logos (first time)"
            else
              echo "Logos already present, skipping copy"
            fi
          else
            echo "No /logos folder found, skipping"
          fi

      - name: Build site (fast; skip logo rescan)
        env:
          SKIP_LOGOS: "1"
        run: |
          python -u scripts/build.py

      - name: Inject last-7 performance
        run: |
          python -u scripts/build_last7.py
           
      - name: Inject Top Predictions (per exchange)
        run: |
          python -u scripts/build_top5.py

      - name: Commit and push updated data + dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Data dist || true
          git commit -m "Auto-update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
