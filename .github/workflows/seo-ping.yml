name: Daily Sitemap Ping

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC Mon–Fri ≈ 03:00 IST next day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Search Engines
        run: |
          echo "Pinging search engines for updated sitemap..."
          curl -s "https://www.google.com/ping?sitemap=https://stockpricepredictions.com/sitemap.xml" -o /dev/null
          curl -s "https://www.bing.com/ping?sitemap=https://stockpricepredictions.com/sitemap.xml" -o /dev/null
          curl -s "https://yandex.com/ping?sitemap=https://stockpricepredictions.com/sitemap.xml" -o /dev/null
          echo "✅ Sitemap ping sent."

