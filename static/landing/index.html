<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Stock Markets - StockPricePredictions</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0e1729;
      color: white;
      margin: 0;
      padding: 0;
    }
    h1 {
      text-align: center;
      margin: 20px 0;
      color: #00b7ff;
    }
    .region {
      margin: 20px;
      padding: 20px;
      background: #111a25;
      border-radius: 10px;
      box-shadow: 0 0 10px #0006;
    }
    .region h2 {
      color: #00b7ff;
      margin-bottom: 10px;
    }
    .countries {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .country-card {
      background: #192b43;
      border: 1px solid #2b4a70;
      border-radius: 10px;
      width: 190px;
      padding: 10px;
      text-align: center;
      transition: all 0.25s ease;
    }
    .country-card:hover {
      background: #203553;
      transform: translateY(-3px);
    }
    .country-flag {
      width: 40px;
      height: 26px;
      border-radius: 4px;
      object-fit: cover;
      display: block;
      margin: 0 auto 6px;
    }
    .country-name {
      font-weight: bold;
      color: #00b7ff;
      margin-bottom: 8px;
    }
    .exchange-list a {
      display: inline-block;
      background: #0d1117;
      color: white;
      padding: 3px 6px;
      margin: 2px;
      border-radius: 8px;
      border: 1px solid #284472;
      font-size: 0.8em;
      text-decoration: none;
    }
    .exchange-list a:hover {
      background: #00b7ff33;
      border-color: #4f7bff;
    }
  </style>
</head>
<body>
  <h1>🌍 Global Stock Markets</h1>

  <div id="content">
    <!-- Example layout; your build script will generate full region/country list -->
    <div class="region">
      <h2>Asia-Pacific</h2>
      <div class="countries">
        <div class="country-card">
          <img src="/logos/countryflags/india.svg" alt="India flag" class="country-flag" />
          <div class="country-name">India</div>
          <div class="exchange-list">
            <a href="/asia-pacific/india/nse/">NSE</a>
            <a href="/asia-pacific/india/bse/">BSE</a>
          </div>
        </div>
        <div class="country-card">
          <img src="/logos/countryflags/malaysia.svg" alt="Malaysia flag" class="country-flag" />
          <div class="country-name">Malaysia</div>
          <div class="exchange-list">
            <a href="/asia-pacific/malaysia/bursa/">BURSA</a>
          </div>
        </div>
      </div>
    </div>

    <div class="region">
      <h2>Europe</h2>
      <div class="countries">
        <div class="country-card">
          <img src="/logos/countryflags/germany.svg" alt="Germany flag" class="country-flag" />
          <div class="country-name">Germany</div>
          <div class="exchange-list">
            <a href="/europe/germany/xetra/">XETRA</a>
          </div>
        </div>
        <div class="country-card">
          <img src="/logos/countryflags/france.svg" alt="France flag" class="country-flag" />
          <div class="country-name">France</div>
          <div class="exchange-list">
            <a href="/europe/france/euronext-paris/">EURONEXT PARIS</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 🟦 New code: country click redirect -->
  <script>
    (function () {
      const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
      $$('.country-card').forEach(card => {
        const firstEx = card.querySelector('.exchange-list a[href]');
        if (!firstEx) return;

        // derive /region/country/ URL from the first exchange link
        const url = new URL(firstEx.getAttribute('href'), location.origin);
        const parts = url.pathname.split('/').filter(Boolean);
        if (parts.length < 3) return;
        const countryUrl = `/${parts[0]}/${parts[1]}/`;

        // make full card clickable except when clicking an exchange
        card.style.cursor = 'pointer';
        card.addEventListener('click', (ev) => {
          if (ev.target.closest('.exchange-list a')) return;
          location.href = countryUrl;
        });

        // make country name act like a link
        const nameEl = card.querySelector('.country-name');
        if (nameEl) {
          nameEl.style.textDecoration = 'underline';
          nameEl.style.textUnderlineOffset = '2px';
          nameEl.style.cursor = 'pointer';
          nameEl.addEventListener('click', (ev) => {
            ev.stopPropagation();
            location.href = countryUrl;
          });
        }
      });
    })();
  </script>
</body>
</html>
